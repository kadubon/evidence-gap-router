name: Validate and release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# A manual run cannot cancel a tag release. Repeated manual checks share a group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.guard.outputs.version }}
      commit: ${{ steps.guard.outputs.commit }}
      release: ${{ steps.guard.outputs.release }}
      manual_run: ${{ steps.guard.outputs.manual_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.19'
          python-version: '3.12'
          enable-cache: true
      - name: Locked quality gates
        run: |
          uv sync --locked --group dev
          uv run --locked ruff check .
          uv run --locked ruff format --check .
          uv run --locked mypy src
          uv run --locked pytest
          uv run --locked python scripts/check_docs.py
      - name: Build and inspect fixed distributions
        run: |
          uv build --no-sources
          uv run --locked python -c 'from pathlib import Path; Path("dist/.gitignore").unlink(missing_ok=True)'
          uv run --locked twine check dist/*
          uv run --locked python scripts/package_audit.py dist --benchmark-freeze experiments/ollama/results/freeze-v0.2.4-r2.json
      - name: Check tag admission and prior manual validation
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --locked python scripts/release_guard.py
      - name: Native Linux installed regressions and SDK/CLI smoke
        env:
          VERSION: ${{ steps.guard.outputs.version }}
        run: |
          uv run --no-project --python 3.12 python scripts/native_check.py --wheel dist/*.whl --version "$VERSION" --python 3.12 --platform Linux --architecture x86_64 --report "$RUNNER_TEMP/native/linux-3.12.json"
      - name: Build a wheel from the sdist outside the source checkout
        env:
          VERSION: ${{ steps.guard.outputs.version }}
        run: |
          uv build --no-sources --wheel dist/*.tar.gz --out-dir "$RUNNER_TEMP/egr-sdist-wheel"
          uv run --locked python scripts/package_audit.py dist --rebuilt-wheel "$RUNNER_TEMP"/egr-sdist-wheel/*.whl
          uv venv --seed --python 3.12 "$RUNNER_TEMP/egr-sdist"
          "$RUNNER_TEMP/egr-sdist/bin/python" -m pip --isolated install --no-cache-dir "$RUNNER_TEMP"/egr-sdist-wheel/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/egr-sdist/bin/python" -I "$GITHUB_WORKSPACE/scripts/smoke.py" --expected-version "$VERSION"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-linux-3.12-${{ github.sha }}
          path: ${{ runner.temp }}/native/linux-3.12.json
          if-no-files-found: error

  windows:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.19'
          python-version: '3.12'
          enable-cache: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions-${{ github.sha }}
          path: dist/
      - name: Native Windows installed regressions and Unicode file smoke
        shell: pwsh
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          $wheel = @(Get-ChildItem -LiteralPath dist -Filter '*.whl')
          if ($wheel.Count -ne 1) { throw 'Expected exactly one wheel' }
          uv run --no-project --python 3.12 python scripts/native_check.py --wheel $wheel[0].FullName --version $env:VERSION --python 3.12 --platform Windows --architecture x86_64 --report (Join-Path $env:RUNNER_TEMP 'native/windows-3.12.json')
          if ($LASTEXITCODE -ne 0) { throw 'native Windows validation failed' }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-windows-3.12-${{ github.sha }}
          path: ${{ runner.temp }}/native/windows-3.12.json
          if-no-files-found: error

  macos-arm64:
    needs: build
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.19'
          python-version: '3.12'
          enable-cache: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions-${{ github.sha }}
          path: dist/
      - name: Native Apple Silicon installed regressions and Unicode file smoke
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: uv run --no-project --python 3.12 python scripts/native_check.py --wheel dist/*.whl --version "$VERSION" --python 3.12 --platform Darwin --architecture arm64 --report "$RUNNER_TEMP/native/macos-arm64-3.12.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-macos-arm64-3.12-${{ github.sha }}
          path: ${{ runner.temp }}/native/macos-arm64-3.12.json
          if-no-files-found: error

  macos-intel:
    needs: build
    runs-on: macos-15-intel
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.19'
          python-version: '3.12'
          enable-cache: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions-${{ github.sha }}
          path: dist/
      - name: Native Intel Mac installed regressions and Unicode file smoke
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: uv run --no-project --python 3.12 python scripts/native_check.py --wheel dist/*.whl --version "$VERSION" --python 3.12 --platform Darwin --architecture x86_64 --report "$RUNNER_TEMP/native/macos-intel-3.12.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-macos-intel-3.12-${{ github.sha }}
          path: ${{ runner.temp }}/native/macos-intel-3.12.json
          if-no-files-found: error

  python-compat:
    name: python-compat (${{ matrix.python }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.19'
          python-version: ${{ matrix.python }}
          enable-cache: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions-${{ github.sha }}
          path: dist/
      - name: Supported Python installed core/runner/CLI regressions
        env:
          VERSION: ${{ needs.build.outputs.version }}
          PYTHON: ${{ matrix.python }}
        run: uv run --no-project --python "$PYTHON" python scripts/native_check.py --wheel dist/*.whl --version "$VERSION" --python "$PYTHON" --platform Linux --architecture x86_64 --report "$RUNNER_TEMP/native/linux-$PYTHON.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-linux-${{ matrix.python }}-${{ github.sha }}
          path: ${{ runner.temp }}/native/linux-${{ matrix.python }}.json
          if-no-files-found: error

  publish:
    needs: [build, windows, macos-arm64, macos-intel, python-compat]
    if: >-
      github.repository == 'kadubon/evidence-gap-router' &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/evidence-gap-router/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions-${{ github.sha }}
          path: dist/
      # No project checkout, build, tests or project scripts run with OIDC permission.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          skip-existing: false

  verify-and-release:
    needs: [build, windows, macos-arm64, macos-intel, python-compat, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.19'
          python-version: '3.12'
          enable-cache: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions-${{ github.sha }}
          path: dist/
      - name: Verify public wheel/sdist hashes and actual downloaded bytes
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: uv run --no-project --python 3.12 python scripts/verify_pypi.py dist "$VERSION"
      - name: Clean official PyPI installation and SDK/CLI smoke
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          uv venv --seed --python 3.12 "$RUNNER_TEMP/egr-pypi"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/egr-pypi/bin/python" -m pip --isolated install --no-cache-dir --index-url https://pypi.org/simple "evidence-gap-router==$VERSION"
          "$RUNNER_TEMP/egr-pypi/bin/python" -I "$GITHUB_WORKSPACE/scripts/smoke.py" --expected-version "$VERSION"
          mkdir "$RUNNER_TEMP/egr-public-bench"
          cp -R "$GITHUB_WORKSPACE/benchmarks" "$RUNNER_TEMP/egr-public-bench/benchmarks"
          "$RUNNER_TEMP/egr-pypi/bin/python" -I "$RUNNER_TEMP/egr-public-bench/benchmarks/smoke.py"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-*-${{ github.sha }}
          path: release/native/
          merge-multiple: true
      - name: Create GitHub Release after successful public verification
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          COMMIT: ${{ needs.build.outputs.commit }}
          MANUAL_RUN: ${{ needs.build.outputs.manual_run }}
        run: |
          uv run --no-project --python 3.12 python scripts/release_notes.py --version "$VERSION" --commit "$COMMIT" --manual-run "$MANUAL_RUN" --release-run "$GITHUB_RUN_ID" --profiles release/native --dist dist --output release/notes.md
          uv run --no-project --python 3.12 python scripts/experiment_assets.py release/experiment --version "$VERSION"
          gh release create "v$VERSION" dist/*.whl dist/*.tar.gz release/SHA256SUMS release/native/*.json release/experiment/* --repo kadubon/evidence-gap-router --verify-tag --title "v$VERSION" --notes-file release/notes.md
