name: Validate and release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# A manual run cannot cancel a tag release. Repeated manual checks share a group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.guard.outputs.version }}
      commit: ${{ steps.guard.outputs.commit }}
      release: ${{ steps.guard.outputs.release }}
      manual_run: ${{ steps.guard.outputs.manual_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.19'
          python-version: '3.12'
          enable-cache: true
      - name: Locked quality gates
        run: |
          uv sync --locked --group dev
          uv run --locked ruff check .
          uv run --locked ruff format --check .
          uv run --locked mypy src
          uv run --locked pytest
      - name: Build and inspect fixed distributions
        run: |
          uv build --no-sources
          uv run --locked python -c 'from pathlib import Path; Path("dist/.gitignore").unlink(missing_ok=True)'
          uv run --locked twine check dist/*
          uv run --locked python scripts/package_audit.py dist
      - name: Check tag admission and prior manual validation
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --locked python scripts/release_guard.py
      - name: Clean Linux wheel installation and SDK/CLI smoke
        run: |
          uv venv --seed --python 3.12 "$RUNNER_TEMP/egr-wheel"
          "$RUNNER_TEMP/egr-wheel/bin/python" -m pip --isolated install --no-cache-dir dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/egr-wheel/bin/python" -I "$GITHUB_WORKSPACE/scripts/smoke.py"
      - name: Build a wheel from the sdist outside the source checkout
        run: |
          uv build --no-sources --wheel dist/*.tar.gz --out-dir "$RUNNER_TEMP/egr-sdist-wheel"
          uv venv --seed --python 3.12 "$RUNNER_TEMP/egr-sdist"
          "$RUNNER_TEMP/egr-sdist/bin/python" -m pip --isolated install --no-cache-dir "$RUNNER_TEMP"/egr-sdist-wheel/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/egr-sdist/bin/python" -I "$GITHUB_WORKSPACE/scripts/smoke.py"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  windows:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.19'
          python-version: '3.12'
          enable-cache: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions-${{ github.sha }}
          path: dist/
      - name: Clean Windows installation of the same wheel
        shell: pwsh
        run: |
          $cleanEnv = Join-Path $env:RUNNER_TEMP 'egr-wheel'
          uv venv --seed --python 3.12 $cleanEnv
          if ($LASTEXITCODE -ne 0) { throw 'venv creation failed' }
          $cleanPython = Join-Path $cleanEnv 'Scripts/python.exe'
          $wheel = @(Get-ChildItem -LiteralPath dist -Filter '*.whl')
          if ($wheel.Count -ne 1) { throw 'Expected exactly one wheel' }
          & $cleanPython -m pip --isolated install --no-cache-dir $wheel[0].FullName
          if ($LASTEXITCODE -ne 0) { throw 'wheel install failed' }
          Set-Location -LiteralPath $env:RUNNER_TEMP
          & $cleanPython -I (Join-Path $env:GITHUB_WORKSPACE 'scripts/smoke.py')
          if ($LASTEXITCODE -ne 0) { throw 'clean Windows smoke failed' }

  publish:
    needs: [build, windows]
    if: >-
      github.repository == 'kadubon/evidence-gap-router' &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/evidence-gap-router/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions-${{ github.sha }}
          path: dist/
      # No project checkout, build, tests or project scripts run with OIDC permission.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          skip-existing: false

  verify-and-release:
    needs: [build, windows, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.19'
          python-version: '3.12'
          enable-cache: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions-${{ github.sha }}
          path: dist/
      - name: Verify public wheel/sdist hashes and actual downloaded bytes
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: uv run --no-project --python 3.12 python scripts/verify_pypi.py dist "$VERSION"
      - name: Clean official PyPI installation and SDK/CLI smoke
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          uv venv --seed --python 3.12 "$RUNNER_TEMP/egr-pypi"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/egr-pypi/bin/python" -m pip --isolated install --no-cache-dir --index-url https://pypi.org/simple "evidence-gap-router==$VERSION"
          "$RUNNER_TEMP/egr-pypi/bin/python" -I "$GITHUB_WORKSPACE/scripts/smoke.py"
      - name: Create GitHub Release after successful public verification
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          COMMIT: ${{ needs.build.outputs.commit }}
          MANUAL_RUN: ${{ needs.build.outputs.manual_run }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          Path('release/notes.md').write_text(
              'Initial evidence-gap router SDK and offline CLI.\n\n'
              'Python 3.12 or newer; Apache-2.0. Deterministic routing from declared '
              'obligations, explicit verification, provenance and separate resource limits. '
              'Includes real offline CSV/JSON callback demos.\n\n'
              'Single process and writer. No semantic truth or independence inference, '
              'external execution, crash recovery, or exactly-once guarantee.\n\n'
              f"Commit: {os.environ['COMMIT']}\n\n"
              f"Manual validation: https://github.com/kadubon/evidence-gap-router/actions/runs/{os.environ['MANUAL_RUN']}\n\n"
              f"Release validation: https://github.com/kadubon/evidence-gap-router/actions/runs/{os.environ['GITHUB_RUN_ID']}\n\n"
              'The official PyPI file digests and actual downloaded wheel/sdist bytes '
              'matched these artifacts. A clean official-index installation passed the '
              'SDK, CLI and bundled demo smoke. This is artifact equality, not a claim '
              'of fully reproducible builds or real-world performance.\n',
              encoding='utf-8',
          )
          PY
          gh release create "v$VERSION" dist/*.whl dist/*.tar.gz release/SHA256SUMS --repo kadubon/evidence-gap-router --verify-tag --title "v$VERSION" --notes-file release/notes.md
